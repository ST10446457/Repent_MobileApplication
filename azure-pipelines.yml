trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
- checkout: self
  displayName: 'Checkout REPENT Android source'

- bash: |
    set -euo pipefail
    export JAVA_HOME="$JAVA_HOME_17_X64"
    export PATH="$JAVA_HOME/bin:$PATH"
    java -version
    curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o "$AGENT_TEMPDIRECTORY/gradle-8.7-bin.zip"
    unzip -q "$AGENT_TEMPDIRECTORY/gradle-8.7-bin.zip" -d "$AGENT_TEMPDIRECTORY"
    "$AGENT_TEMPDIRECTORY/gradle-8.7/bin/gradle" --version
  displayName: 'Prepare Java 17 and Gradle 8.7'

- bash: |
    set -euo pipefail
    export JAVA_HOME="$JAVA_HOME_17_X64"
    export PATH="$JAVA_HOME/bin:$PATH"
    "$AGENT_TEMPDIRECTORY/gradle-8.7/bin/gradle" --no-daemon --console=plain testDebugUnitTest assembleDebug
  displayName: 'Run JUnit tests and build debug APK'

- task: PublishTestResults@2
  displayName: 'Publish Android JUnit results'
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '**/TEST-*.xml'
    searchFolder: '$(System.DefaultWorkingDirectory)/app/build/test-results'
    failTaskOnFailedTests: true
    failTaskOnMissingResultsFile: true

- task: PublishPipelineArtifact@1
  displayName: 'Publish REPENT debug APK'
  condition: succeeded()
  inputs:
    targetPath: '$(System.DefaultWorkingDirectory)/app/build/outputs/apk/debug/app-debug.apk'
    artifact: 'REPENT-debug-apk'
