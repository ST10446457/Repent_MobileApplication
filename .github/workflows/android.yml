name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  android-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Run JUnit tests and build debug APK
        run: gradle --no-daemon --console=plain testDebugUnitTest assembleDebug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: REPENT-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
